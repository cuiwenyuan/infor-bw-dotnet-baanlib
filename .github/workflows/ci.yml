name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            8.0.x
            10.0.x

      - name: Build library
        run: dotnet build src/DotNet.BaanWindowsLib/DotNet.BaanWindowsLib.csproj -c Release

      - name: Test
        run: dotnet test tests/DotNet.BaanWindowsLib.Tests/DotNet.BaanWindowsLib.Tests.csproj -c Release

      - name: Pack NuGet package
        run: dotnet pack src/DotNet.BaanWindowsLib/DotNet.BaanWindowsLib.csproj -c Release

<svg viewBox="0 0 680 360" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Baan Company 在调用链中的绑定位置</title>
<desc>展示 .NET 应用、类库、OLE ProgID、BW 连接配置、bshell 与公司号之间的关系</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<g>
<rect x="40" y="24" width="600" height="52" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="60" y="45" font-family="sans-serif" font-size="14" font-weight="500" fill="#0C447C">.NET 应用 + 本类库</text>
<text x="60" y="64" font-family="sans-serif" font-size="12" fill="#185FA5">new Baan("Baan.Application.erpln") &#8594; 只发 ParseExecFunction，不带 Company</text>
</g>

<line x1="340" y1="76" x2="340" y2="100" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
<rect x="40" y="100" width="600" height="52" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="60" y="121" font-family="sans-serif" font-size="14" font-weight="500" fill="#3C3489">OLE ProgID / 自动化类名</text>
<text x="60" y="140" font-family="sans-serif" font-size="12" fill="#534AB7">在注册表中映射到某一个 BW 连接配置（可为每个公司注册不同 ProgID）</text>
</g>

<line x1="340" y1="152" x2="340" y2="176" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
<rect x="40" y="176" width="600" height="64" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="60" y="200" font-family="sans-serif" font-size="14" font-weight="500" fill="#085041">BW 连接配置文件（关键层）</text>
<text x="60" y="220" font-family="sans-serif" font-size="12" fill="#0F6E56">定义 server / port / login / bshell 启动参数 &#8212; Company 在这里绑定</text>
<text x="60" y="235" font-family="sans-serif" font-size="12" fill="#0F6E56">方式A：配置固定公司号；方式B：由 4GL DLL 运行时切换</text>
</g>

<line x1="340" y1="240" x2="340" y2="264" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
<rect x="40" y="264" width="600" height="52" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="60" y="285" font-family="sans-serif" font-size="14" font-weight="500" fill="#633806">bshell / 应用服务器会话</text>
<text x="60" y="304" font-family="sans-serif" font-size="12" fill="#854F0B">以选定的 Company 号运行你的 4GL DLL 函数逻辑</text>
</g>
</svg>

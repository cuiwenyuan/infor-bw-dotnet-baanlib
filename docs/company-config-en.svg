<svg viewBox="0 0 680 360" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Where Baan Company is bound in the call chain</title>
<desc>Shows the relationship between the .NET app, the library, the OLE ProgID, the BW connection config, the bshell, and the company number</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<g>
<rect x="40" y="24" width="600" height="52" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="60" y="45" font-family="sans-serif" font-size="14" font-weight="500" fill="#0C447C">.NET application + this library</text>
<text x="60" y="64" font-family="sans-serif" font-size="12" fill="#185FA5">new Baan("Baan.Application.erpln") &#8594; sends only ParseExecFunction, no Company</text>
</g>

<line x1="340" y1="76" x2="340" y2="100" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
<rect x="40" y="100" width="600" height="52" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="60" y="121" font-family="sans-serif" font-size="14" font-weight="500" fill="#3C3489">OLE ProgID / automation class name</text>
<text x="60" y="140" font-family="sans-serif" font-size="12" fill="#534AB7">Mapped in the registry to a BW connection config (a different ProgID per company)</text>
</g>

<line x1="340" y1="152" x2="340" y2="176" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
<rect x="40" y="176" width="600" height="64" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="60" y="200" font-family="sans-serif" font-size="14" font-weight="500" fill="#085041">BW connection config file (the key layer)</text>
<text x="60" y="220" font-family="sans-serif" font-size="12" fill="#0F6E56">Defines server / port / login / bshell startup args &#8212; Company is bound here</text>
<text x="60" y="235" font-family="sans-serif" font-size="12" fill="#0F6E56">Approach A: configure a fixed company; Approach B: switch at runtime in the 4GL DLL</text>
</g>

<line x1="340" y1="240" x2="340" y2="264" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
<rect x="40" y="264" width="600" height="52" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="60" y="285" font-family="sans-serif" font-size="14" font-weight="500" fill="#633806">bshell / application server session</text>
<text x="60" y="304" font-family="sans-serif" font-size="12" fill="#854F0B">Runs your 4GL DLL function logic under the selected Company number</text>
</g>
</svg>
